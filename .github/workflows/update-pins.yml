name: Update candy map pins

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pins
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pins.json from sign-up form
        env:
          CSV_URL: ${{ secrets.SIGNUP_CSV_URL }}
        run: python3 scripts/build_pins.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- pins.json geocache.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pins.json geocache.json
          git commit -m "Update candy map pins"
          git pull --rebase
          git push
